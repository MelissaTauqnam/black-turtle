services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales_hub
      POSTGRES_PASSWORD: sales_hub
      POSTGRES_DB: sales_hub
    ports:
      - "5432:5432"
    volumes:
      - sales_hub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_hub -d sales_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sales_hub_pg_data:
